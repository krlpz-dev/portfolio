<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Karl Petzold Portfolio</title>
<meta name="description" content="Karl Petzold, art direction, brand campaigns and generative AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&family=EB+Garamond:ital,wght@0,500;1,400;1,500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Karl's own faces, picked up when the files are dropped into /fonts */
@font-face{font-family:"KP Display";src:url(fonts/Muller-Bold.woff2) format("woff2"),url(fonts/Muller-Bold.woff) format("woff");font-weight:700;font-display:swap}
@font-face{font-family:"KP Text";src:url(fonts/Muller-Regular.woff2) format("woff2"),url(fonts/Muller-Regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"KP Text";src:url(fonts/Muller-Light.woff2) format("woff2"),url(fonts/Muller-Light.woff) format("woff");font-weight:300;font-display:swap}
@font-face{font-family:"KP Serif";src:url(fonts/SabonLTStd-Italic.woff2) format("woff2"),url(fonts/SabonLTStd-Italic.woff) format("woff");font-style:italic;font-display:swap}

:root{
  --paper:#D2D8DB; --paper-2:#C6CED2; --paper-3:#E3E7E9;
  --ink:#292A2C; --ink-2:#565D61; --slate:#829DA7;
  --night:#1C1F20; --night-2:#262A2C; --on-night:#E9EDEF; --on-night-2:#9AA7AD;
  --blue:#829DA7; --clay:#BB7E6D;
  --display:"KP Display","Outfit",system-ui,sans-serif;
  --text:"KP Text","Outfit",system-ui,sans-serif;
  --serif:"KP Serif","EB Garamond",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(20px,5vw,72px);
  --top:clamp(26px,4.6vh,54px);          /* distance of the header from the top edge */
  --head:calc(var(--top) + 62px);        /* room kept under the header */
  --ease:cubic-bezier(.16,1,.3,1);
  --soft:cubic-bezier(.45,0,.2,1);
  --vh:100svh;
  color-scheme:light;
}
@supports not (height:100svh){:root{--vh:100vh}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--text);font-weight:400;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
img,video{max-width:100%;display:block}
a{color:inherit}
button,input{font:inherit;color:inherit}
::selection{background:var(--blue);color:#fff}

/* ---------- deck ---------- */
#deck{height:var(--vh);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-x pan-y}
#deck::-webkit-scrollbar{display:none}
.slide{position:relative;height:var(--vh);min-height:var(--vh);overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + var(--head)) var(--pad) calc(env(safe-area-inset-bottom,0px) + 64px);display:flex;flex-direction:column;justify-content:center}
.slide.dark{background:var(--night);color:var(--on-night)}
.slide.paper2{background:var(--paper-2)}
.wrap{width:100%;max-width:1240px;margin-inline:auto}

/* ---------- type ---------- */
.eyebrow{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.dark .eyebrow{color:var(--on-night-2)}
#contact .eyebrow{margin-bottom:clamp(12px,1.8vw,26px)}
#summary .eyebrow{margin-bottom:clamp(18px,3vw,44px);position:relative;top:calc(-1*clamp(6px,1vw,14px))}
.cover .eyebrow,#work .eyebrow{margin-bottom:clamp(6px,1.2vw,16px);position:relative;top:calc(-1*clamp(3px,.5vw,8px))}
.h-xxl{font-family:var(--display);font-weight:700;font-size:clamp(56px,12.5vw,190px);line-height:.88;letter-spacing:-.035em;margin:0}
.h-xl{font-family:var(--display);font-weight:700;font-size:clamp(40px,7.4vw,112px);line-height:.93;letter-spacing:-.03em;margin:0;text-wrap:balance}
.h-l{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.4vw,64px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lede{font-family:var(--serif);font-style:italic;font-size:clamp(21px,2.3vw,32px);line-height:1.3;margin:0;max-width:30ch;text-wrap:balance}
.body{font-size:clamp(15px,1.15vw,17px);line-height:1.65;margin:0;max-width:58ch;color:var(--ink-2)}
.dark .body{color:var(--on-night-2)}
.body strong{color:var(--ink);font-weight:500}
.meta{font-size:13px;letter-spacing:.02em;color:var(--ink-2)}
.dark .meta{color:var(--on-night-2)}
.blue{color:var(--blue)}

/* ---------- reveal ---------- */
.js [data-r]{opacity:0;transform:translateY(34px);filter:blur(6px);transition:opacity 1.6s var(--ease),transform 2s var(--ease),filter 1.6s var(--ease);transition-delay:calc(var(--d,0) * 170ms + 180ms)}
.js [data-r="fade"]{transform:none}
.js [data-r="scale"]{transform:scale(1.06)}
.js .in [data-r]{opacity:1;transform:none;filter:none}
.js .out [data-r]{opacity:0;transform:translateY(-18px);filter:blur(4px);transition-duration:.9s;transition-delay:0s}
.js .out .mask>span{transform:translateY(-30%);opacity:0;transition:transform 1s var(--soft);transition-delay:0s}
.mask{display:block;overflow:hidden;padding:.14em .3em .2em;margin:-.14em -.3em -.2em}
.mask>span{display:block}
.js .mask>span{transform:translateY(115%);transition:transform 1.9s var(--ease),opacity 1.2s var(--soft);transition-delay:calc(var(--d,0) * 170ms + 180ms)}
.js .in .mask>span{transform:none;opacity:1}

/* ---------- chrome ---------- */
.top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + var(--top)) var(--pad) 0;pointer-events:none;transition:color 1.1s var(--soft)}
.top>*{pointer-events:auto}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;text-decoration:none}
.top-r{display:flex;align-items:center;gap:18px}
.chap{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.lang{display:inline-flex;border:1px solid currentColor;border-radius:999px;padding:2px;opacity:.9}
.lang button{border:0;background:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;padding:6px 10px;border-radius:999px;transition:background .35s var(--ease),color .35s var(--ease)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
body[data-tone="dark"] .top{color:var(--on-night)}
body[data-tone="dark"] .lang button[aria-pressed="true"]{background:var(--on-night);color:var(--night)}
.jet{position:fixed;right:calc(var(--pad) * .5 - 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);z-index:31;width:104px;height:104px;padding:0;border:0;background:none;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity 1s var(--soft),transform 1s var(--ease)}
.jet img{width:100%;height:100%;object-fit:contain;transition:transform .6s var(--ease)}
.jet.on{opacity:.9;pointer-events:auto;transform:none}
.jet:hover img{transform:translateY(-5px)}
@media (max-width:760px){.jet{width:76px;height:76px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}}
.progress{position:fixed;left:0;top:0;height:2px;background:var(--blue);width:0;z-index:31;transition:width 1.4s var(--soft)}
.rail{position:fixed;right:max(14px,calc(var(--pad) * .35));top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.rail a{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-decoration:none;height:14px}
.rail .tick{width:14px;height:2px;background:currentColor;opacity:.3;transition:width .9s var(--ease),opacity .9s}
.rail .lbl{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:translateX(6px);transition:opacity .3s,transform .4s var(--ease);white-space:nowrap}
.rail a:hover .lbl,.rail a:focus-visible .lbl{opacity:.8;transform:none}
.rail a.on .tick{width:28px;opacity:1}
body[data-tone="dark"] .rail{color:var(--on-night)}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,10px);z-index:30;display:flex;flex-direction:column;align-items:center;gap:10px;
  opacity:0;pointer-events:none;transition:opacity 1.4s var(--ease),transform 1.4s var(--ease);font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;border:0;background:none;cursor:pointer}
.hint.show{opacity:.9;transform:translate(-50%,0);pointer-events:auto}
.hint span{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.hint svg{width:14px;height:22px;overflow:visible;animation:arrow 2.8s cubic-bezier(.45,0,.2,1) infinite}
@keyframes arrow{0%{clip-path:inset(0 0 100% 0);transform:translateY(-4px);opacity:0}
  15%{opacity:1}55%{clip-path:inset(0 0 0 0);transform:translateY(0);opacity:1}
  85%{clip-path:inset(0 0 0 0);transform:translateY(3px);opacity:0}100%{clip-path:inset(0 0 100% 0);opacity:0}}
body[data-tone="dark"] .hint{color:var(--on-night)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
@media (max-width:760px){
  .chap{display:none}
  .rail{right:6px;gap:9px}.rail .lbl{display:none}.rail .tick{width:9px}.rail a.on .tick{width:16px}
  .slide{padding-top:calc(env(safe-area-inset-top,0px) + var(--head) - 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 58px)}
  .hint{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);gap:6px}
}

/* ---------- cover ---------- */
.cover{justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 72px)}
.cover-bg{position:absolute;inset:0;z-index:0}
.cover-bg img,.cover-bg video{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 12s cubic-bezier(.12,.6,.2,1)}
.cover.in .cover-bg img,.cover.in .cover-bg video{transform:scale(1)}
.cover-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,16,.55) 0%,rgba(13,15,16,.15) 30%,rgba(13,15,16,.35) 55%,rgba(13,15,16,.9) 100%),linear-gradient(90deg,rgba(13,15,16,.55),rgba(13,15,16,0) 60%)}
.cover.has-bg{background:#0d0f10}
.cover.has-bg .meta,.cover.has-bg .lede{color:var(--on-night)}
.cover .wrap{position:relative;z-index:1;display:grid;gap:clamp(18px,2.4vw,28px)}
.cover .h-xxl{font-size:clamp(48px,10vw,152px);line-height:.8}
.cover .lede{max-width:62ch}
.cover .foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 40px}
.grain{position:absolute;inset:0;z-index:0;opacity:.5;pointer-events:none;width:100%;height:100%}

/* ---------- who ---------- */
.who{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,6vw,96px);align-items:center}
.portrait{position:relative;aspect-ratio:4/5;max-height:calc(var(--vh) - 190px);width:100%;justify-self:center;overflow:hidden;background:linear-gradient(160deg,#B9C3C8,#8FA2AA);margin:0}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.portrait .cap{position:absolute;left:12px;bottom:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--display);font-weight:700;color:#fff;mix-blend-mode:difference;opacity:.8}
.who .txt{display:grid;gap:22px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;letter-spacing:.02em;padding:7px 12px;border:1px solid rgba(41,42,44,.22);border-radius:999px}
@media (max-width:760px){
  .who{grid-template-columns:1fr;gap:18px}
  .portrait{aspect-ratio:1/1;max-height:28svh;width:auto;justify-self:start}
  .who .txt{gap:12px}.who .body{font-size:14px;line-height:1.55}
}
.cv-btn{display:inline-flex;align-items:center;gap:14px;padding:14px 22px;border:1px solid currentColor;color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:background-color .5s var(--soft),color .5s var(--soft)}
.cv-btn svg{width:12px;height:14px;transition:transform .6s var(--ease)}
.cv-btn:hover{background:var(--ink);color:var(--paper)}
.cv-btn:hover svg{transform:translateY(2px)}
@media (max-width:760px){.cv-btn{padding:11px 18px;font-size:10px}}
/* small phones (iPhone SE and below): everything must fit in one screen */
@media (max-width:760px) and (max-height:620px){
  .portrait{max-height:19svh}
  #who h2{font-size:26px}
  .who .txt{gap:8px}.who .body{font-size:12.5px;line-height:1.42}
  #work .eyebrow{display:none}#work .h-xl{font-size:22px;line-height:1.05}
  #work .idx{gap:8px 14px;margin-top:8px}#work .idx a{font-size:11px;line-height:1.12;padding:0;gap:6px}#work .idx a small{font-size:9px}#work .idx h3{font-size:9px;margin-bottom:3px;padding-bottom:3px}#work .idx ul{gap:1px}
  .hint{display:none!important}
  #work{justify-content:flex-start;padding-bottom:12px}
  .case-d .cd-body{-webkit-line-clamp:6}
}
@media (max-width:860px) and (min-height:700px){.case-d .cd-body{-webkit-line-clamp:11}}

/* ---------- summary ---------- */
.toc{list-style:none;margin:clamp(20px,3.5vw,48px) 0 0;padding:0;border-top:1px solid rgba(41,42,44,.22)}
.toc li{border-bottom:1px solid rgba(41,42,44,.22)}
.toc a{position:relative;display:grid;grid-template-columns:56px 1fr auto;align-items:baseline;gap:16px;padding:clamp(14px,2vw,24px) 0;text-decoration:none;overflow:hidden}
.toc .no{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.toc .t{display:block;font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,56px);line-height:1;letter-spacing:-.02em;transition:transform 1s var(--ease),color .6s}
.toc .s{display:block;font-size:13px;letter-spacing:.01em;color:var(--ink-2);margin-top:8px}
.toc .arr{font-family:var(--display);font-weight:700;font-size:clamp(18px,2vw,26px);transform:translateX(-10px);opacity:0;transition:transform .9s var(--ease),opacity .7s}
.toc a::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:0;background:var(--blue);transition:width 1.2s var(--ease)}
.toc a:hover .t{transform:translateX(10px);color:var(--blue)}
.toc a:hover .arr{transform:none;opacity:1;color:var(--blue)}
.toc a:hover::after{width:100%}
.lock{display:inline-block;width:.42em;height:.34em;border:2px solid currentColor;border-radius:2px;position:relative;margin-left:.35em;vertical-align:.02em}
.lock::before{content:"";position:absolute;left:50%;bottom:100%;width:.24em;height:.2em;border:2px solid currentColor;border-bottom:0;border-radius:.2em .2em 0 0;transform:translateX(-50%)}
@media (max-width:760px){.toc .t{font-size:clamp(22px,7vw,32px)}.letter-head .h-xl{font-size:clamp(30px,10.5vw,44px)}.toc a{grid-template-columns:34px 1fr auto;gap:10px;padding:14px 0}.toc .s{font-size:12px;margin-top:5px}}

/* ---------- gate ---------- */
.gate .wrap{display:grid;gap:22px}
.gate .closed,.gate .ok{display:grid;gap:22px;max-width:760px}
.gate form{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.gate input{flex:1 1 240px;min-width:0;background:transparent;border:0;border-bottom:1px solid rgba(233,237,239,.4);padding:14px 2px;font-family:var(--display);font-weight:700;font-size:clamp(20px,2.2vw,28px);letter-spacing:.06em;color:var(--on-night);outline:none;transition:border-color .3s;border-radius:0}
.gate input:focus{border-color:var(--on-night)}
.gate input::placeholder{color:var(--on-night-2);opacity:.6;letter-spacing:.02em;font-weight:400;font-family:var(--text)}
.btn{border:1px solid currentColor;background:none;border-radius:999px;padding:12px 22px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:background .3s,color .3s}
.dark .btn:hover{background:var(--on-night);color:var(--night)}
.gate .err{min-height:1.2em;font-size:13px;color:#E48B74}
.gate.shake form{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.gate .skip{font-size:13px;color:var(--on-night-2);text-decoration:none;border-bottom:1px solid rgba(233,237,239,.25);justify-self:start;padding-bottom:2px}
.gate .skip:hover{color:var(--on-night)}
.gate .ok{display:none}
.gate.open .ok{display:grid}
.gate.open .closed{display:none}
.bigLock{width:44px;height:44px;position:relative}
.bigLock b{position:absolute;left:6px;right:6px;bottom:4px;height:22px;border:2px solid currentColor;border-radius:4px}
.bigLock i{position:absolute;left:13px;width:18px;height:16px;top:6px;border:2px solid currentColor;border-bottom:0;border-radius:10px 10px 0 0;transition:transform 1.2s var(--ease)}
.gate.open .bigLock i{transform:translate(9px,-5px) rotate(20deg)}
.slide[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- portfolio index ---------- */
.idx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(14px,2.4vw,36px);margin-top:clamp(18px,3vw,40px)}
.idx h3{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid rgba(41,42,44,.25)}
.idx ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.idx a{display:flex;gap:10px;align-items:baseline;text-decoration:none;font-family:var(--display);font-weight:700;font-size:clamp(15px,1.35vw,19px);line-height:1.25;padding:3px 0;transition:color .6s,transform .8s var(--ease)}
.idx a small{font-family:var(--text);font-weight:400;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.idx a:hover{color:var(--blue);transform:translateX(4px)}
.peek{position:fixed;z-index:25;width:220px;aspect-ratio:4/3;pointer-events:none;overflow:hidden;opacity:0;transform:translate(-50%,-50%) scale(.92) rotate(-2deg);transition:opacity .6s var(--ease),transform .9s var(--ease),left .5s var(--ease),top .5s var(--ease);background:var(--paper-2)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
.peek img{width:100%;height:100%;object-fit:cover}
@media (max-width:980px){.idx{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}.idx a{font-size:14px}.idx h3{margin-bottom:6px;padding-bottom:6px}.idx ul{gap:1px}}
@media (hover:none){.peek{display:none}}

/* ---------- case intercalaire (after the Pavillon Noir gaming deck) ---------- */
.case-t{--acc:#829DA7;padding:0;justify-content:center;align-items:center;color:#fff;background:#0d0f10;text-align:center}
.case-t .bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.case-t .bg img,.case-t .bg video{width:100%;height:100%;object-fit:cover;filter:blur(3px) saturate(.9);transform:scale(1.14);transition:transform 10s cubic-bezier(.12,.6,.2,1)}
.case-t.in .bg img,.case-t.in .bg video{transform:scale(1.04)}
.case-t .veil{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 45%,rgba(8,9,10,.25),rgba(8,9,10,.72) 75%),linear-gradient(180deg,rgba(8,9,10,.35),rgba(8,9,10,.15) 40%,rgba(8,9,10,.6))}
.case-t .hero{position:absolute;inset:0;z-index:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.case-t .hero img{height:88%;width:auto;max-width:none;object-fit:contain;opacity:.95}
.ct{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2vw,26px);width:min(92vw,1180px);padding:0 16px;margin-top:-4vh}
.ct-logo img{--lk:min(26vh,38vw);max-height:min(40vh,420px);max-width:min(84vw,760px);width:var(--lk);height:auto;object-fit:contain;filter:none}
.ct-logo{margin-bottom:clamp(8px,2.4vh,28px)}
.ct-logo.inv img{filter:brightness(0) invert(1)}
.ct-title{font-family:var(--display);font-weight:700;font-size:clamp(48px,9vw,150px);line-height:.95;letter-spacing:-.03em;margin:0;text-wrap:balance}
.case-t .ct *{text-shadow:none;box-shadow:none}
.ct-sub{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.9vw,40px);line-height:1.1;letter-spacing:.04em;text-wrap:balance;text-transform:uppercase;margin-top:6px}
.ct-tag{font-family:var(--mono);font-style:italic;font-size:clamp(13px,1.5vw,21px);line-height:1.36;max-width:46ch;margin:0;opacity:.9}
.ct-btn{margin-top:14px;display:inline-flex;align-items:center;justify-content:center;min-width:min(300px,70vw);padding:13px 26px;background:var(--acc);color:#101213;text-decoration:none;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:0;cursor:pointer;transition:filter .6s var(--soft),transform .8s var(--ease)}
.ct-btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.ct-line{position:absolute;left:50%;bottom:0;width:1px;height:calc(50vh - 150px);max-height:26vh;background:rgba(255,255,255,.55);transform-origin:top;z-index:1}
.js .ct-line{transform:scaleY(0);transition:transform 2.2s var(--ease) 1.4s}
.js .in .ct-line{transform:scaleY(1)}
.js .out .ct-line{transform:scaleY(0);transition-delay:0s;transition-duration:.8s}
.case-t .num{position:absolute;top:calc(env(safe-area-inset-top,0px) + var(--head));left:var(--pad);z-index:2;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.16em;opacity:.7}
/* vertical marks on the right edge, like the deck */
.edge{position:absolute;right:clamp(14px,2vw,26px);top:0;bottom:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 96px) 0 calc(env(safe-area-inset-bottom,0px) + 28px);pointer-events:none;color:#fff}
.edge .v{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.edge .ast{width:16px;height:16px;opacity:.9}
.js .edge{opacity:0;transition:opacity 1.6s var(--soft) .9s}
.js .in .edge{opacity:1}
.rail{transition:opacity .8s var(--soft)}

/* ---------- category intercalaire ---------- */
.cat-t{background:var(--night);color:var(--on-night);align-items:center;justify-content:center;text-align:center}
.cat-t .wrap{display:grid;justify-items:center;gap:clamp(16px,2.4vw,30px)}
.cat-t .h-xxl{font-size:clamp(64px,15vw,240px)}
.cat-t .lede{max-width:34ch;color:var(--on-night)}
.cat-list{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;max-width:900px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-night-2)}
.cat-list a{text-decoration:none;transition:color .6s var(--soft)}
.cat-list a:hover{color:var(--on-night)}

/* ---------- case detail ---------- */
.case-d{--acc:#829DA7;padding:0;background:#0d0f10;color:var(--on-night);justify-content:stretch}
.cd{display:grid;grid-template-columns:minmax(300px,34%) 1fr;height:100%;min-height:0}
.cd-info{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + var(--head) + 4px) clamp(22px,3vw,48px) 48px var(--pad);min-width:0;overflow:hidden}
.cd-marks{display:flex;gap:14px;align-items:center;min-height:30px}
.cd-marks img{height:40px;width:auto;max-width:140px;object-fit:contain}
.cd-title{font-family:var(--display);font-weight:700;font-size:clamp(20px,1.8vw,28px);line-height:1.05;letter-spacing:-.01em;text-transform:uppercase;margin:0}
.cd-sub{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-2);margin-top:-6px}
.cd-lab{display:inline-block;justify-self:start;align-self:flex-start;background:var(--on-night);color:#0d0f10;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;margin-bottom:4px}
.cd-block p,.cd-body{font-family:var(--mono);font-size:clamp(11.5px,.86vw,13px);line-height:1.6;color:#C9D1D5;margin:0;max-width:52ch}
.cd-body{color:var(--on-night-2)}
.cd-stats{display:flex;flex-wrap:wrap;gap:clamp(18px,2.6vw,40px);margin-top:6px}
.cd-stats .v{font-family:var(--serif);font-weight:500;font-size:clamp(34px,3.4vw,54px);line-height:1;color:var(--acc);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.cd-stats .l{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-2);margin-top:8px;max-width:20ch;line-height:1.4}
.cd-role{font-family:var(--mono);font-size:12px;color:var(--on-night-2)}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1.15fr 1fr;gap:3px;min-height:0;height:100%}
.mosaic>*{position:relative;overflow:hidden;background:#15181a;min-height:0}
.mosaic>*:first-child{grid-column:1/-1}
.mosaic.n1{grid-template-rows:1fr}
.mosaic.n2{grid-template-columns:1fr 1fr}.mosaic.n2>*:first-child{grid-column:auto}.mosaic.n2{grid-template-rows:1fr}
.mosaic.n3{grid-template-columns:1fr 1fr}
.mosaic img,.mosaic video{width:100%;height:100%;object-fit:cover;transition:opacity 1.6s var(--soft)}
.wip{display:inline-block;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.18em;line-height:1;padding:6px 9px 5px 11px;border:1px solid #829DA7;color:#829DA7;border-radius:999px;vertical-align:middle;justify-self:center}
.wip.sm{font-size:9px;padding:4px 6px 3px 8px;margin-left:8px;align-self:center}
.mosaic .wip-ph{display:grid;place-content:center;justify-items:center;gap:14px;text-align:center}
.mosaic .wip-ph b{font-family:var(--display);font-weight:700;font-size:clamp(56px,9vw,140px);line-height:.9;letter-spacing:-.02em;color:#2c3336}
.mosaic .wip-ph i{font-family:var(--mono);font-style:italic;font-size:14px;color:#829DA7}
.mosaic .ph{background:repeating-linear-gradient(135deg,#15181a 0 12px,#1b1f21 12px 13px)}
.mosaic .ph span{position:absolute;left:12px;bottom:10px;font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6c777c}
.js .mosaic>*{clip-path:inset(100% 0 0 0);transition:clip-path 1.7s var(--ease);transition-delay:calc(var(--k,0) * 170ms + 450ms)}
.js .in .mosaic>*{clip-path:inset(0 0 0 0)}
@media (max-width:860px){
  .cd{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .cd-info{justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + var(--head) - 8px) var(--pad) 14px;gap:10px}
  .cd-block{display:none}
  .cd-body{font-size:12px;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
  .cd-stats .v{font-size:34px}
  .mosaic{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:4px;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 56px);scrollbar-width:none}
  .mosaic::-webkit-scrollbar{display:none}
  .mosaic>*{flex:0 0 82%;scroll-snap-align:start}
  .edge{display:none}
  .ct-line{display:none}
}

/* ---------- letter ---------- */
.letter{height:auto;overflow:visible;justify-content:flex-start;padding-top:0;padding-bottom:0}
.slide.letter{background:#1d1f20;color:#fff;--lt-on:#fff;--lt-off:rgba(255,255,255,.18)}
.letter-head{height:var(--vh);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:22px}
.letter-head .h-xl .mask:nth-child(2) span{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.lt-wrap{position:relative;width:100%;max-width:760px;margin:0 auto;padding:6svh 0 52svh}
.lt{position:relative;font-family:var(--display);font-weight:700;font-size:clamp(21px,2.45vw,37px);line-height:1.28;letter-spacing:-.015em;text-align:center}
.lt p{margin:0 0 1.1em;text-wrap:pretty}
.lt .w{color:var(--lt-off,rgba(41,42,44,.2))}
.lt .w.rd{color:var(--lt-on,var(--ink))}
.lt .kw .w{transition:color 1.1s var(--soft),text-shadow 1.1s var(--soft)}
.lt .kw.act .w{color:var(--blue)}
.lt .w.cur{color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(90deg,var(--wc,var(--lt-on,var(--ink))) calc(var(--p,0)*100%),var(--lt-off,rgba(41,42,44,.2)) calc(var(--p,0)*100%));transition:none}
.lt .kw.act .w.cur{--wc:var(--blue)}
.lt .lt-h{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.25em;line-height:1.1;margin:1.6em 0 1em;color:var(--lt-on,var(--ink))}
.lt .sign{font-family:var(--serif);font-style:italic;font-weight:400;font-size:.85em;margin-top:1.2em}
.caretR{position:absolute;left:0;top:0;width:2px;height:1em;background:var(--blue);border-radius:2px;pointer-events:none;opacity:0;transition:opacity .6s var(--soft);will-change:transform}
.caretR.on{opacity:1}
@keyframes blink{50%{opacity:.15}}
.fx{position:absolute;z-index:5;width:300px;pointer-events:none;opacity:0;transform:translateY(18px) scale(.97);filter:blur(4px);transition:opacity 1s var(--ease),transform 1.2s var(--ease),filter 1s var(--ease),top 1.2s var(--ease)}
.fx.show{opacity:1;transform:none;filter:none}
.fx .card{background:var(--night);color:var(--on-night);border-radius:8px;overflow:hidden;box-shadow:0 18px 50px rgba(28,31,32,.28);text-align:left}
.fx .card.light{background:var(--paper-3);color:var(--ink)}
.fx .card.bare{background:none;box-shadow:none;border-radius:0;overflow:visible}
.fx .card.bare .denoise{overflow:hidden;box-shadow:0 24px 60px rgba(28,31,32,.25)}
.fx .card.bare canvas{border-radius:0}
pre.term.art{font-size:5.6px;line-height:1.0;font-weight:500;letter-spacing:0;white-space:pre;padding-top:14px;padding-bottom:14px}
.fx .lbl{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:10px 14px 0;opacity:.6}
.fx .card>.lbl+*{margin-top:10px}
.fx .pad{padding:12px 14px 14px}
.fx img,.fx video{width:100%;aspect-ratio:4/3;object-fit:cover}
.lt{z-index:2}
.fx.photo{position:fixed;z-index:1;width:min(30vw,480px)!important;left:var(--fx-x,10vw)!important;right:auto;top:var(--fx-y,50%);transform:translateY(-46%) scale(.985);filter:none;transition:opacity 1.3s var(--soft),transform 4.3s cubic-bezier(.2,.6,.3,1)}
.fx.photo.show{transform:translateY(-50%) scale(1)}
.fx.photo .card{background:none;box-shadow:none;border-radius:0}
.fx.photo img,.fx.photo video{aspect-ratio:4/5;opacity:.82}
@media (max-width:980px){.fx.photo{width:min(64vw,340px)!important}}
.fx canvas{display:block;width:100%;height:180px}
.fx .big{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;letter-spacing:-.03em;padding:14px 14px 4px}
.fx .brandCard{font-family:var(--display);font-weight:700;font-size:38px;letter-spacing:-.02em;padding:34px 16px;text-align:center}
/* when the side margins are too narrow, the card docks at the bottom of the screen */
.fx.dock{position:fixed;left:50%!important;top:auto!important;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);width:min(84vw,340px)!important;transform:translate(-50%,18px) scale(.97)}
.fx.dock.show{transform:translate(-50%,0)}
.fx.dock img,.fx.dock video{aspect-ratio:16/9}
.fx.dock canvas{height:120px}
.fx.dock .term{min-height:0;font-size:11px}
/* soft veil under the header while reading the letter */
.top::before{content:"";position:absolute;inset:0 0 -34px 0;background:linear-gradient(var(--paper) 55%,rgba(210,216,219,0));opacity:0;transition:opacity .9s var(--soft);z-index:-1;pointer-events:none}
body.reading .top::before{opacity:1}
/* the dark veil depends on the tone only, so it keeps its colour while it fades out (no pale flash when leaving the letter) */
body[data-tone="dark"] .top::before{background:linear-gradient(#1d1f20 55%,rgba(29,31,32,0))}
.term{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;line-height:1.65;color:#C9D3D7;white-space:pre-wrap;word-break:break-all;min-height:110px;letter-spacing:0;font-weight:400}
.term .c{color:#6E7B81}.term .ok{color:#8FBF9F}
pre.term{margin:0;white-space:pre;overflow:hidden}
.term .sb{color:#8FBF9F;font-weight:400}
pre.term.art b{font-weight:500}
/* at the end the window melts away: only the snake stays, floating over the page */
.fx .card{transition:background-color 1.4s var(--soft),box-shadow 1.4s var(--soft)}
.fx .card.dissolve{background-color:transparent;box-shadow:none}
.fx .card.dissolve .lbl{opacity:0;transition:opacity .8s var(--soft)}
.fx .card.dissolve pre.art{filter:brightness(.62) saturate(1.35) contrast(1.15)}.term .sh{color:#C8F5D2;font-weight:400}
.gpu{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.gpu .fan{width:54px;height:54px;border-radius:50%;border:2px solid rgba(233,237,239,.35);background:conic-gradient(from 0deg,rgba(233,237,239,.55) 0 18%,transparent 18% 33%,rgba(233,237,239,.55) 33% 51%,transparent 51% 66%,rgba(233,237,239,.55) 66% 84%,transparent 84%);animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gpu .deg{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gpu .bar{height:4px;background:rgba(233,237,239,.15);margin-top:10px;border-radius:2px;overflow:hidden}
.gpu .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#829DA7,#FF8205,#E10500)}
.caret{display:inline-block;width:7px;height:1.05em;background:currentColor;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.chat{display:grid;gap:8px}
.bub{padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.4;max-width:90%;opacity:0;transform:translateY(8px);transition:opacity .9s var(--ease),transform 1.1s var(--ease);font-family:var(--text);font-weight:400;letter-spacing:0}
.bub.me{justify-self:end;background:var(--on-night);color:var(--night);border-bottom-right-radius:3px}
.bub.ai{justify-self:start;background:var(--night-2);border-bottom-left-radius:3px}
.bub.show{opacity:1;transform:none}
.typing{display:inline-flex;gap:4px}
.typing b{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35;animation:dot 1.1s infinite}
.typing b:nth-child(2){animation-delay:.15s}.typing b:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{opacity:1;transform:translateY(-2px)}}
.denoise{overflow:hidden}
.denoise{position:relative}
.denoise img,.denoise video{filter:blur(5px) saturate(.4);transform:scale(1.03);animation:denoise 1.3s cubic-bezier(.3,.6,.3,1) .15s forwards}
.denoise canvas.nz{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;animation:nzout 1.2s cubic-bezier(.4,0,.2,1) .1s forwards}
@keyframes denoise{to{filter:none;transform:scale(1)}}
@keyframes nzout{to{opacity:0}}

/* ---------- contact ---------- */
.contact-list{display:grid;margin-top:clamp(20px,3vw,40px);max-width:760px}
.row{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid rgba(233,237,239,.16)}
.row .k{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-2)}
.row .v{font-family:var(--display);font-weight:700;font-size:clamp(17px,2vw,26px);text-decoration:none;overflow-wrap:anywhere;justify-self:start;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .5s var(--ease)}
.row a.v:hover{background-size:100% 1px}
.copy{border:1px solid rgba(233,237,239,.3);background:none;border-radius:999px;padding:7px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--display);font-weight:700;cursor:pointer;color:var(--on-night);transition:background .3s,color .3s}
.copy:hover{background:var(--on-night);color:var(--night)}
.copy.ext{display:inline-flex;align-items:center;justify-content:center;justify-self:end;width:34px;height:30px;padding:0;text-decoration:none}
.copy.ext svg{width:11px;height:11px;transition:transform .5s var(--ease)}
.copy.ext:hover svg{transform:translate(1px,-1px)}
@media (max-width:620px){.row{grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0}.row .k{grid-column:1/-1}}

/* ---------- merci ---------- */
.merci{align-items:center;text-align:center}
.merci .word{display:inline-flex}
.merci .word span{display:inline-block}
.js .merci .word span{transform:translateY(110%);opacity:0;transition:transform 1.8s var(--ease),opacity 1.4s var(--soft);transition-delay:calc(var(--i) * 120ms + 200ms)}
.js .merci.in .word span{transform:none;opacity:1}
.in .merci-wave span{animation:wave 5s var(--soft) infinite;animation-delay:calc(var(--i) * 140ms + 2.4s)}
@keyframes wave{0%,70%,100%{transform:none}35%{transform:translateY(-.06em)}}
.merci .h-xxl{overflow:hidden;padding:.14em .06em .22em;margin:-.14em -.06em -.22em}
.back{margin-top:34px;border:1px solid currentColor;background:none;border-radius:999px;padding:10px 18px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;transition:opacity .3s}
.back:hover{opacity:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body data-tone="light">
<div class="progress" id="progress"></div>
<header class="top">
  <a class="brand" href="#cover" data-go="cover">Karl Petzold</a>
  <div class="top-r">
    <span class="chap" id="chap"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
    </div>
  </div>

  - Toute autre clé affiche les images du dossier images/05-lettre/<clé>/ ; si le dossier est vide, une carte typographique.

<script type="text/plain" id="letter-fr">
Je vais être franc d'emblée : après une longue carrière de directeur artistique, le choc de {sisyphe:2019 m'a fait douter. À quoi bon ? Quel sens donner à tout ça ?}

Peu après, au fil de mes recherches, je tombais presque par hasard sur {grimoire:une technologie qui semblait tout droit sortie d'un obscur grimoire.}

C'était l'une des toutes premières versions accessibles de {python:Disco Diffusion}. Quelques lignes de Python, deux-trois ajustements, un prompt, les ventilos qui s'emballent, puis {rendu:une image qui surgit du néant}.

Depuis, l'IA a pris une place déterminante dans ma vie.

J’ai co-créé le département IA de Pavillon Noir, {weave:formé plus de 300 personnes}, produit des campagnes pour de grandes marques et développé {constellation:le cerveau IA de l'agence}, sans jamais cesser d’expérimenter de mon côté.

## Alors, pourquoi Mistral ?

Quand j'ai vu l'annonce, je me suis figé.

J'ai découvert Mistral à l'époque du fameux {torrent:torrent de Mistral 7B}, lâché presque l'air de rien sur Twitter. Un geste qui, à lui seul, disait déjà beaucoup de votre état d'esprit. Et je dois l'avouer, voir {challenger:un challenger français entrer dans l'arène avec cette fougue} était particulièrement réjouissant.

Depuis, j'ai suivi vos faits d'armes de près, tout en intégrant ChatGPT et Claude à mon quotidien. {stop:Lorsque le gouvernement américain a restreint l'accès à Fable 5}, j'y ai vu un signal très clair : tôt ou tard, l'Europe devrait pouvoir compter sur son propre champion.

C'est aussi pour cela que je vous écris aujourd'hui.

Pour cette {epopee:énergie de conquête, presque d'épopée}. Pour ce que Mistral représente déjà, et pour tout ce qu'il peut devenir. Et parce que je suis profondément convaincu que l'IA va accompagner l'humanité bien au-delà de ce que nous sommes aujourd'hui capables d'imaginer.

Avec le recul, {choix:beaucoup des choix que j'ai faits ces dernières années semblent converger vers ce moment précis.}

Je serais honoré de pouvoir vous en parler de vive voix.

-- Karl
</script>
<script type="text/plain" id="letter-en">
I’ll be straightforward: after a long career as an Art Director, the shock of {sisyphe:2019 made me question things. What was the point? What meaning could I give to all of this?}

Not long after, while exploring new technologies, I came across {grimoire:something that seemed straight out of some obscure mage book.}

It was one of the very first accessible versions of {python:Disco Diffusion}. A few lines of Python, a couple of tweaks, a prompt, the fans spinning up, then {rendu:an image emerging out of nothing}.

AI has played a decisive role in my life ever since.

I co-built Pavillon Noir’s AI practice, {weave:trained more than 300 people}, produced campaigns for major brands, and developed {constellation:the agency's AI brain}, while never stopping my own experiments.

## So, why Mistral?

When I saw the opening, my heart skipped a beat.

I first discovered Mistral when that now-famous {torrent:Mistral 7B torrent} appeared on Twitter, dropped almost casually. That gesture alone said a lot about the way you operate. And I have to admit, seeing {challenger:an ambitious French challenger step into the arena} was particularly exciting.

I’ve followed Mistral closely ever since, while making ChatGPT and Claude part of my daily workflow. {stop:When the US government restricted access to Fable 5}, I saw it as a clear signal: sooner or later, Europe would need a champion of its own.

That is also why I’m writing to you today.

It is this {epopee:energy of conquest, this sense of a modern-day epic}, and the vision of a near future where AI helps humanity break through its own limits that drive me to reach out. For what Mistral already represents, and for everything it can become.

Looking back, {choix:many of the choices I’ve made over the past few years seem to have led me to this precise moment.}

I would be honored to discuss it with you in person.

-- Karl
</script>

  else if(key==='mistral'){const cv=document.createElement('canvas');card.appendChild(cv);pixField(cv,alive,'warm')}
  else if(/^count\d+$/.test(key)){card.className='card light';card.innerHTML=`<div class="big"><span class="cnt" data-n="${key.slice(5)}">0</span><span class="blue">+</span></div><div class="lbl" style="padding:0 14px 14px">${L().countL}</div>`;countUp(card)}
  else if(imgs.length){let i=0;const w=document.createElement('div');w.appendChild(media(imgs[0],text,true));card.appendChild(w);
    if(imgs.length>1){const iv=setInterval(()=>{if(!alive()){clearInterval(iv);return}i=(i+1)%imgs.length;w.innerHTML='';w.appendChild(media(imgs[i],text,true))},1600)}}
  else{card.className='card light';card.innerHTML=`<div class="brandCard">${text}</div>`}
  return card;
}
function typeTerm(box,alive){const lines=L().term;let li=0;
  (function next(){if(!alive())return;if(li>=lines.length){box.insertAdjacentHTML('beforeend','<span class="caret"></span>');return}
    const ln=lines[li];const s=document.createElement('span');if(li===4)s.className='ok';box.appendChild(s);
    if(li===3){s.textContent=ln;const bar=document.createElement('span');bar.className='c';box.appendChild(bar);let k=0;
      const iv=setInterval(()=>{if(!alive()){clearInterval(iv);return}k+=25;const f=k/25;bar.textContent=`[${'█'.repeat(f)}${'·'.repeat(10-f)}] ${k}/250`;if(k>=250){clearInterval(iv);box.appendChild(document.createTextNode('\n'));li++;setTimeout(next,200)}},170);return}
    let c=0;const iv=setInterval(()=>{if(!alive()){clearInterval(iv);return}s.textContent=ln.slice(0,++c);if(c>=ln.length){clearInterval(iv);box.appendChild(document.createTextNode('\n'));li++;setTimeout(next,120)}},16)})();}
/* the code types itself, fades out, and types again, in a loop */
function snake(pre,alive){
  const code=['import torch, clip','from disco import Diffusion','','model = Diffusion(steps=250)','img = model("a lighthouse in a storm,','            oil painting")','img.save("0001.png")'].join('\n');
  pre.style.transition='opacity .9s var(--soft)';pre.style.minHeight='11.9em';
  (function cycle(){if(!alive())return;pre.style.opacity=1;let i=0;
    (function ty(){if(!alive())return;i+=2;pre.innerHTML=code.slice(0,i).replace(/</g,'&lt;')+'<span class="caret"></span>';
      if(i<code.length)setTimeout(ty,26);
      else setTimeout(()=>{if(!alive())return;pre.style.opacity=0;setTimeout(()=>{pre.innerHTML='';cycle()},1000)},2600)})();
  })();
}
function gpu(card,alive){const d=$('.deg span',card),bar=$('.bar i',card),t0=performance.now();
  (function f(t){if(!alive())return;const p=Math.min(1,(t-t0)/3200),v=38+Math.round(45*(1-Math.pow(1-p,2)));d.textContent=v;bar.style.width=(p*100)+'%';if(p<1)requestAnimationFrame(f)})(t0)}
function typeLine(box,alive,txt){let i=0;(function t(){if(!alive())return;i++;box.textContent=txt.slice(0,i);if(i<txt.length)setTimeout(t,24);else box.insertAdjacentHTML('beforeend',' <span class="caret"></span>')})()}
function typeMagnet(box,alive){const plain='magnet:?xt=urn:btih:…&dn=mistral-7B-v0.1&tr=udp%3A%2F%2Fopentracker…';let i=0;
  (function t(){if(!alive())return;i+=2;box.textContent=plain.slice(0,i);if(i<plain.length)setTimeout(t,20);else box.insertAdjacentHTML('beforeend',' <span class="caret"></span>')})()}
function runChat(box,alive){L().chat.forEach((m,i)=>{const b=document.createElement('div');b.className='bub '+m[0];box.appendChild(b);
  setTimeout(()=>{if(!alive())return;if(m[0]==='ai'){b.innerHTML='<span class="typing"><b></b><b></b><b></b></span>';b.classList.add('show');setTimeout(()=>{if(alive())b.textContent=m[1]},900)}else{b.textContent=m[1];b.classList.add('show')}},300+i*1200)})}
function pixField(cv,alive,mode){
  const WARM=['#FFD800','#FFAF00','#FF8205','#FA500F','#E10500'];
  requestAnimationFrame(()=>{const dpr=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);const x=cv.getContext('2d');
    const cell=Math.round(12*dpr),cols=Math.ceil(cv.width/cell),rows=Math.ceil(cv.height/cell),cells=[];
    for(let y=0;y<rows;y++)for(let c=0;c<cols;c++){const w=mode==='noise'?1:Math.max(0,1-Math.hypot(1-c/cols,1-y/rows)*1.1);cells.push({c,y,w,col:WARM[Math.min(4,Math.max(0,Math.floor((1-y/rows)*5+Math.random())))],ph:Math.random()*6.28,sp:.5+Math.random()*1.5})}
    const t0=performance.now();
    (function loop(t){if(!alive())return;requestAnimationFrame(loop);const el=(t-t0)/1000;x.globalAlpha=1;x.fillStyle='#1C1F20';x.fillRect(0,0,cv.width,cv.height);
      cells.forEach(p=>{let a=0,col=p.col;
        if(mode==='noise'){const v=Math.random();a=Math.max(.08,1-el/2.6)*v;col=`rgb(${120+v*120|0},${130+v*110|0},${140+v*100|0})`}
        else if(mode==='switch'){const off=Math.max(0,1-el/1.2);if(off>0){x.globalAlpha=off*.45;x.fillStyle='#829DA7';x.fillRect(p.c*cell,p.y*cell,cell-2,cell-2)}a=Math.min(1,Math.max(0,(el-1.4-(1-p.w)*1.4)))*(.35+.65*(.5+.5*Math.sin(el*p.sp+p.ph)))*p.w}
        else a=Math.min(1,el)*(.25+.75*(.5+.5*Math.sin(el*p.sp+p.ph)))*p.w;
        if(a>0.02){x.globalAlpha=a;x.fillStyle=col;x.fillRect(p.c*cell,p.y*cell,cell-2,cell-2)}})})(t0);
  });
}

/* ============================ I18N ============================ */
function applyLang(){
  document.documentElement.lang=LANG;
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
  $$('[data-t]').forEach(el=>{const v=L()[el.dataset.t];if(v!=null)el.innerHTML=v});
  $$('[data-tph]').forEach(el=>el.placeholder=L()[el.dataset.tph]);
  $$('[data-cat]').forEach(el=>el.textContent=L().cats[el.dataset.cat]);
  $$('[data-tcat]').forEach(el=>el.textContent=L().catSub[el.dataset.tcat]);
  $$('.case-t,.case-d').forEach(d=>{const c=d._case;if(!c)return;$$('[data-case]',d).forEach(el=>{if(el.tagName==='SECTION')return;const k=el.dataset.case;el.textContent=loc(k==='sub'?(c.sub||c.client):c[k])||''});
    $$('[data-case-l]',d).forEach(l=>l.textContent=loc(JSON.parse(l.dataset.caseL)))});
  $$('[data-tn]').forEach(el=>el.innerHTML=L()[el.dataset.tn].replace('{n}',CASES.length||''));
  $$('.stxt').forEach(s=>s.textContent=s.dataset[LANG]||s.dataset.en);
  $('#toc').innerHTML=L().toc.map((r,i)=>`<li><a href="#${r[0]}" data-go="${r[0]}"><span class="no">${String(i+1).padStart(2,'0')}</span><span><span class="t">${r[1]}${r[3]?'<span class="lock" aria-hidden="true"></span>':''}</span>${r[2]?`<span class="s">${r[2]}</span>`:''}</span><span class="arr">→</span></a></li>`).join('');
  $('#merciWord').innerHTML=[...L().merci].map((ch,i)=>`<span style="--i:${i}">${ch}</span>`).join('');
  buildIndex();buildLetter();buildRail();letterScroll();
  if(current){const c=current;c.classList.remove('in');void c.offsetWidth;current=null;activate(c)}
  store.set('kp-lang',LANG);
}
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{if(LANG!==b.dataset.lang){LANG=b.dataset.lang;applyLang()}}));

/* ============================ NAV : custom eased transitions ============================ */
const deck=$('#deck');
const CHAPS=["cover","who","summary","work","letter","contact","merci"];
const slides=()=>$$('#deck > .slide').filter(s=>!s.hidden);
function firstOf(c){const s=$(`#deck > .slide[data-chap="${c}"]`);return s?s.id:'cover'}
function buildRail(){$('#rail').innerHTML=CHAPS.map(c=>`<li><a href="#${firstOf(c)}" data-go="${firstOf(c)}" data-rail="${c}"><span class="lbl">${L().chap[c]}</span><span class="tick"></span></a></li>`).join('')}
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeIO=t=>t<.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2;   // quint in-out: slow start, long glide, soft landing
let anim=null,lockUntil=0;
function animateTo(y,dur,onMid){
  if(anim)cancelAnimationFrame(anim);
  const y0=deck.scrollTop,dy=y-y0;
  if(Math.abs(dy)<2||REDUCE){deck.scrollTop=y;onMid&&onMid();settle();return}
  const t0=performance.now();let mid=false;document.body.classList.add('moving');
  const f=t=>{const p=Math.min(1,(t-t0)/dur);deck.scrollTop=y0+dy*easeIO(p);
    if(!mid&&p>.3){mid=true;onMid&&onMid()}
    if(p<1)anim=requestAnimationFrame(f);else{anim=null;document.body.classList.remove('moving');lockUntil=performance.now()+180;settle()}};
  anim=requestAnimationFrame(f);
}
function go(id){if(id==='gate'&&$('#gate').hidden)id='work';const el=document.getElementById(id);if(!el)return;
  const dist=Math.abs(el.offsetTop-deck.scrollTop)/innerHeight;
  animateTo(el.offsetTop,Math.min(2100,1250+Math.max(0,dist-1)*110),()=>activate(el))}
function indexAt(){const y=deck.scrollTop+innerHeight*.5;let k=0;slides().forEach((el,i)=>{if(el.offsetTop<=y)k=i});return k}
function step(dir){
  const s=slides(),i=indexAt(),cur=s[i];
  if(cur&&cur.id==='letter'){const r=cur.getBoundingClientRect();
    if(dir>0&&r.bottom>innerHeight+2){animateTo(deck.scrollTop+Math.min(innerHeight*.7,r.bottom-innerHeight),1100);return}
    if(dir<0&&r.top<-2){animateTo(deck.scrollTop+Math.max(-innerHeight*.7,r.top),1100);return}}
  const n=s[i+dir];if(!n)return;
  if(n.id==='letter'&&dir<0){animateTo(n.offsetTop+n.offsetHeight-innerHeight,1300,()=>activate(n));return}
  go(n.id);
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go)}});
document.addEventListener('keydown',e=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(anim&&['ArrowDown','PageDown',' ','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();return}
  if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();step(1)}
  if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();step(-1)}
  if(e.key==='Home'){e.preventDefault();go('cover')}if(e.key==='End'){e.preventDefault();go('merci')}});
$('#hint').addEventListener('click',()=>step(1));
$('#jet').addEventListener('click',()=>{const d=deck.scrollTop/innerHeight;animateTo(0,Math.min(2600,1200+d*70),()=>activate($('#cover')))});

/* inside the letter the page scrolls freely; at its edges, the next gesture moves to the neighbouring screen */
function letterRect(){return $('#letter').getBoundingClientRect()}
function insideLetter(){const r=letterRect();return r.top<=2&&r.bottom>=innerHeight-2}
let lastWheel=0,consumed=false,acc=0,lastFree=0;
deck.addEventListener('wheel',e=>{
  const now=performance.now(),gap=now-lastWheel;lastWheel=now;
  if(gap>240){consumed=false;acc=0}
  if(!anim&&insideLetter()){const r=letterRect();
    const atEnd=(e.deltaY>0&&r.bottom<=innerHeight+2)||(e.deltaY<0&&r.top>=-2);
    if(!atEnd){lastFree=now;return}                 // native scrolling inside the letter
    if(now-lastFree<320){e.preventDefault();lastFree=now;return}  // let inertia die before leaving the letter
  }
  e.preventDefault();
  if(anim||consumed||now<lockUntil)return;
  acc+=e.deltaY;
  if(Math.abs(acc)>28){consumed=true;acc=0;step(Math.sign(e.deltaY))}
},{passive:false});
let tY=null,tX=0,tFree=false;
deck.addEventListener('touchstart',e=>{tY=e.touches[0].clientY;tX=e.touches[0].clientX;tFree=insideLetter()},{passive:true});
deck.addEventListener('touchmove',e=>{if(tY==null)return;const dy=tY-e.touches[0].clientY,dx=tX-e.touches[0].clientX;
  if(anim){e.preventDefault();return}
  if(tFree){const r=letterRect();if((dy>0&&r.bottom<=innerHeight+2)||(dy<0&&r.top>=-2))e.preventDefault();return}
  if(Math.abs(dy)>=Math.abs(dx))e.preventDefault()},{passive:false});
deck.addEventListener('touchend',e=>{if(tY==null)return;const dy=tY-e.changedTouches[0].clientY,dx=tX-e.changedTouches[0].clientX;tY=null;
  if(anim||Math.abs(dy)<44||Math.abs(dx)>Math.abs(dy))return;const dir=dy>0?1:-1;
  if(tFree){const r=letterRect();if((dir>0&&r.bottom<=innerHeight+2)||(dir<0&&r.top>=-2))step(dir);return}
  step(dir)},{passive:true});

/* ============================ ACTIVATION ============================ */
let hintT=null;
function activate(sl){
  if(current===sl)return;const prev=current;current=sl;
  if(prev){prev.classList.add('out')}
  sl.classList.remove('out');sl.classList.add('in');
  document.body.dataset.tone=(sl.classList.contains('dark')||sl.dataset.tone==='dark')?'dark':'light';document.body.classList.toggle('case',!!sl.dataset.case);
  const chap=sl.dataset.chap;$('#chap').textContent=chap==='cover'?'':(L().chap[chap]||'');
  $$('#rail a').forEach(a=>a.classList.toggle('on',a.dataset.rail===chap));
  const all=slides(),i=all.indexOf(sl);$('#progress').style.width=(i/(all.length-1)*100)+'%';
  if(location.hash!=='#'+sl.id)history.replaceState(null,'','#'+sl.id);
  armHint();countUp(sl);
  if(sl.id==='gate'&&!$('#gate').classList.contains('open')&&matchMedia('(hover:hover)').matches)setTimeout(()=>{if(current===sl)$('#pw').focus({preventScroll:true})},1600);
  $$('video',sl).forEach(v=>v.play&&v.play().catch(()=>{}));
}
/* once a transition has landed, reset the screens that left the viewport so they replay next time */
function settle(){const vh=innerHeight;slides().forEach(s=>{if(s===current)return;const r=s.getBoundingClientRect();
  if(r.bottom<=1||r.top>=vh-1){s.classList.remove('in','out')}})}
function syncJet(){$('#jet').classList.toggle('on',deck.scrollTop>innerHeight*.6)}
function armHint(){$('#hint').classList.remove('show');clearTimeout(hintT);const all=slides();
  if(current&&current.id==='gate'&&!$('#gate').classList.contains('open'))return;
  if(current&&all.indexOf(current)<all.length-1)hintT=setTimeout(()=>{if(!anim)$('#hint').classList.add('show')},3800)}
const io=new IntersectionObserver(es=>{if(anim)return;es.forEach(e=>{if(e.target.id==='letter')return;if(e.isIntersecting&&e.intersectionRatio>=.55)activate(e.target)})},{root:deck,threshold:[.55]});
slides().forEach(s=>io.observe(s));
function letterZone(){const r=letterRect();if(!anim&&r.top<innerHeight*.45&&r.bottom>innerHeight*.55)activate($('#letter'));
  document.body.classList.toggle('reading',r.top<60&&r.bottom>innerHeight*.3);return r}
let st;
deck.addEventListener('scroll',()=>{$('#hint').classList.remove('show');letterScroll();letterZone();syncJet();
  clearTimeout(st);st=setTimeout(()=>{if(!anim){settle();armHint()}},200)},{passive:true});
addEventListener('resize',()=>{readIdx=-1;readF=-1;letterScroll();if(current&&!anim&&current.id!=='letter')deck.scrollTop=current.offsetTop});

/* ============================ MICRO ============================ */
function countUp(root){$$('.cnt',root).forEach(el=>{const n=+el.dataset.n,dec=+(el.dataset.dec||0),t0=performance.now()+700,dur=2600;
  const fmt=v=>dec?v.toFixed(dec).replace('.',LANG==='fr'?',':'.'):Math.round(v).toLocaleString(LANG==='fr'?'fr-FR':'en-US');el.textContent=fmt(0);
  const stp=t=>{const p=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-p,4);el.textContent=fmt(n*e);if(p<1)requestAnimationFrame(stp);else el.textContent=fmt(n)};requestAnimationFrame(stp)})}
document.addEventListener('click',e=>{const b=e.target.closest('.copy');if(!b)return;const v=b.dataset.copy;const done=()=>{b.textContent=L().copied;setTimeout(()=>b.textContent=L().copy,1600)};
  const sel=()=>{const a=b.previousElementSibling,r=document.createRange();r.selectNodeContents(a);const s=getSelection();s.removeAllRanges();s.addRange(r)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done).catch(sel);else sel()});

(()=>{const cv=$('#grain');if(!cv)return;const x=cv.getContext('2d');let w,h;function rs(){w=cv.width=Math.ceil(innerWidth/3);h=cv.height=Math.ceil(innerHeight/3)}rs();addEventListener('resize',rs);let f=0;
  (function loop(){if(!document.getElementById('grain'))return;requestAnimationFrame(loop);if(f++%3||!current||current.id!=='cover')return;const im=x.createImageData(w,h);for(let i=0;i<im.data.length;i+=4){const v=180+Math.random()*60;im.data[i]=v;im.data[i+1]=v+4;im.data[i+2]=v+8;im.data[i+3]=Math.random()*38}x.putImageData(im,0,0)})()})();

/* ============================ INIT ============================ */
applyLang();
(async()=>{
  const h=location.hash.slice(1),el=h&&document.getElementById(h);
  if(el&&el.classList.contains('slide')){deck.scrollTop=el.offsetTop;activate(el)}else activate($('#cover'))})();
</script>
